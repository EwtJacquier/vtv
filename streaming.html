<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTV Streaming - Catálogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.2rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        header p {
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .search-container {
            padding: 1.5rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        #search {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: background 0.3s;
        }

        #search::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #search:focus {
            background: rgba(255, 255, 255, 0.15);
        }

        .enhanced-toggle {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .enhanced-toggle input {
            accent-color: #764ba2;
        }

        .enhanced-toggle > span {
            color: #764ba2;
            font-size: 0.9rem;
        }

        .enhanced-toggle > span span {
            color: rgba(255, 255, 255, 0.5);
            background: none;
            display: block;
            position: absolute;
            margin-top: 3px;
            font-size: 0.85rem;
        }

        .stats {
            text-align: center;
            padding: 0 2rem 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0 2rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
        }

        .filter-section-label {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 1rem 2rem 3rem;
            max-width: 2200px;
            margin: 0 auto;
        }

        .movie-card {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            min-height: 280px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .movie-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(118, 75, 162, 0.4);
        }

        .movie-poster {
            position: relative;
            flex: 0 0 190px;
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            overflow: hidden;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .movie-poster.no-cover {
            background: linear-gradient(135deg, rgba(220, 130, 70, 0.18) 0%, rgba(140, 60, 30, 0.18) 100%);
        }

        .movie-poster.no-cover::after {
            content: '🎬';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            opacity: 0.35;
        }

        .movie-poster.no-cover::before {
            content: 'SEM CAPA';
            position: absolute;
            bottom: 0.9rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 200, 150, 0.95);
            letter-spacing: 0.2rem;
            font-weight: 700;
            z-index: 1;
        }

        .movie-card:has(.movie-poster.no-cover) {
            border-color: rgba(255, 150, 100, 0.35);
        }

        .movie-card:has(.movie-poster.no-cover):hover {
            border-color: rgba(255, 150, 100, 0.6);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            font-size: 3rem;
        }

        .movie-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.25rem 1.4rem;
            min-width: 0;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.25;
            margin-bottom: 0.6rem;
            color: #fff;
        }

        .movie-synopsis {
            font-size: 0.85rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .movie-synopsis.empty {
            color: rgba(255, 255, 255, 0.35);
            font-style: italic;
        }

        .movie-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.7rem;
        }

        .movie-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.55rem;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(118, 75, 162, 0.35);
            letter-spacing: 0.02rem;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.7rem;
            gap: 0.5rem;
        }

        .movie-duration {
            white-space: nowrap;
        }

        .movie-badge-cc,
        .movie-badge-dub {
            font-size: 0.65rem;
            padding: 0.18rem 0.55rem;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            border-width: 1px;
            border-style: solid;
        }

        .movie-badge-cc {
            background: rgba(255, 200, 100, 0.12);
            color: rgba(255, 210, 130, 0.95);
            border-color: rgba(255, 200, 100, 0.4);
        }

        .movie-badge-dub {
            background: rgba(102, 200, 140, 0.12);
            color: rgba(140, 220, 170, 0.95);
            border-color: rgba(102, 200, 140, 0.4);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.5);
            grid-column: 1 / -1;
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #764ba2;
            grid-column: 1 / -1;
        }

        @media (max-width: 1200px) {
            .movies-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 720px) {
            .movies-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1rem;
            }

            .movie-card {
                min-height: auto;
            }

            .movie-poster {
                flex: 0 0 130px;
            }

            .movie-content {
                padding: 1rem;
            }

            .movie-title {
                font-size: 1rem;
            }

            .movie-synopsis {
                -webkit-line-clamp: 3;
                font-size: 0.8rem;
            }

            header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>VTV - CATÁLOGO</h1>
        <p>Escolha um filme para assistir</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Buscar filme...">
        <label class="enhanced-toggle">
            <input type="checkbox" id="useEnhanced">
            <span>Melhoria de Imagem (Experimental)<span>Melhora drasticamente videos borrados e remove blocos de pixel. Consome GPU.</span></span>
        </label>
    </div>

    <div class="filters-container" id="filters"></div>

    <div class="stats" id="stats"></div>

    <div class="movies-grid" id="movies-grid">
        <div class="loading">Carregando catálogo...</div>
    </div>

    <script>
        const COVERS_DIR = './covers';
        const CHANNELS_DIR = './channels';
        const DB_PATH = './db.json';
        const TAGS_PATH = './tags.json';

        const CHANNEL_FILES = [
            'afterDark', 'animetv', 'epictv', 'hokkaido',
            'marathon', 'neverland', 'paradox', 'rewindtv', 'superHero'
        ];

        let movies = [];
        let allTags = [];
        let tagsMap = {};
        let activeTag = null;
        const CACHE_BUST = Date.now();

        function formatTitle(id) {
            return id
                .replace(/_/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        function formatDuration(sec) {
            if (!sec || sec < 60) return '';
            const h = Math.floor(sec / 3600);
            const m = Math.round((sec % 3600) / 60);
            if (h && m) return `${h}h ${m}min`;
            if (h) return `${h}h`;
            return `${m}min`;
        }

        function tagLabel(slug) {
            return tagsMap[slug] || slug;
        }

        function createMovieCard(movie) {
            const useEnhanced = document.getElementById('useEnhanced').checked;
            const playerPage = useEnhanced ? 'player_enhanced.html' : 'player.html';

            const card = document.createElement('a');
            card.className = 'movie-card';
            card.href = `${playerPage}?movie=${encodeURIComponent(movie.id)}`;

            const coverUrl = `${COVERS_DIR}/${movie.id}.jpg?v=${CACHE_BUST}`;
            const synopsis = movie.synopsis
                ? movie.synopsis
                : 'Sinopse não disponível.';
            const synopsisClass = movie.synopsis ? '' : ' empty';

            const tagsHtml = (movie.tags || []).map(t =>
                `<span class="movie-tag">${tagLabel(t)}</span>`
            ).join('');

            const duration = formatDuration(movie.duration);
            const audioBadge = movie.channels.includes('hokkaido')
                ? '<span class="movie-badge-cc">Legendado</span>'
                : '<span class="movie-badge-dub">Dublado</span>';

            card.innerHTML = `
                <div class="movie-poster">
                    <img src="${coverUrl}" alt="" loading="lazy"
                         onerror="this.parentElement.classList.add('no-cover'); this.remove();">
                    <div class="play-overlay">
                        <span class="play-icon">▶</span>
                    </div>
                </div>
                <div class="movie-content">
                    <div class="movie-title">${movie.title}</div>
                    ${tagsHtml ? `<div class="movie-tags">${tagsHtml}</div>` : ''}
                    <div class="movie-synopsis${synopsisClass}">${synopsis}</div>
                    <div class="movie-meta">
                        <span class="movie-duration">${duration || '—'}</span>
                        ${audioBadge}
                    </div>
                </div>
            `;

            return card;
        }

        function renderMovies(moviesToRender) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';

            if (moviesToRender.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum filme encontrado</div>';
                return;
            }

            moviesToRender.forEach(movie => {
                grid.appendChild(createMovieCard(movie));
            });
        }

        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize('NFD')
                .replace(/[̀-ͯ]/g, '')
                .replace(/ç/g, 'c')
                .replace(/ñ/g, 'n');
        }

        function getFilteredMovies() {
            const query = document.getElementById('search').value;
            const normalizedQuery = normalizeText(query.trim());

            let filtered = movies;

            if (activeTag) {
                filtered = filtered.filter(m => (m.tags || []).includes(activeTag));
            }

            if (normalizedQuery) {
                filtered = filtered.filter(movie =>
                    normalizeText(movie.title).includes(normalizedQuery) ||
                    normalizeText(movie.id).includes(normalizedQuery) ||
                    normalizeText(movie.synopsis || '').includes(normalizedQuery)
                );
            }

            return filtered;
        }

        function updateView() {
            const filtered = getFilteredMovies();
            document.getElementById('stats').textContent =
                filtered.length === movies.length
                    ? `${movies.length} filmes disponíveis`
                    : `${filtered.length} de ${movies.length} filmes`;
            renderMovies(filtered);
        }

        function renderFilters() {
            const container = document.getElementById('filters');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn' + (activeTag === null ? ' active' : '');
            allBtn.textContent = `Todos (${movies.length})`;
            allBtn.addEventListener('click', () => {
                activeTag = null;
                renderFilters();
                updateView();
            });
            container.appendChild(allBtn);

            allTags.forEach(tag => {
                const count = movies.filter(m => (m.tags || []).includes(tag)).length;
                if (!count) return;
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (activeTag === tag ? ' active' : '');
                btn.textContent = `${tagLabel(tag)} (${count})`;
                btn.addEventListener('click', () => {
                    activeTag = activeTag === tag ? null : tag;
                    renderFilters();
                    updateView();
                });
                container.appendChild(btn);
            });
        }

        async function loadJSON(path) {
            try {
                const res = await fetch(`${path}?v=` + Date.now());
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                console.warn(`Falha ao carregar ${path}:`, e);
                return null;
            }
        }

        async function loadMovies() {
            try {
                const movieMap = {};

                const [db, tagsJson] = await Promise.all([
                    loadJSON(DB_PATH),
                    loadJSON(TAGS_PATH),
                ]);
                tagsMap = tagsJson || {};

                const channelFetches = CHANNEL_FILES.map(async (chName) => {
                    const data = await loadJSON(`${CHANNELS_DIR}/${chName}.json`);
                    if (!data) return;

                    for (const key of Object.keys(data)) {
                        if (!key.startsWith('dia_')) continue;
                        for (const entry of data[key]) {
                            if (!entry.id) continue;
                            if (!movieMap[entry.id]) {
                                const meta = (db && db[entry.id]) || null;
                                movieMap[entry.id] = {
                                    id: entry.id,
                                    title: meta?.name || formatTitle(entry.id),
                                    synopsis: meta?.synopsis || '',
                                    tags: meta?.tags || [],
                                    duration: meta?.duration || entry.duration || 0,
                                    channels: []
                                };
                            }
                            if (!movieMap[entry.id].channels.includes(chName)) {
                                movieMap[entry.id].channels.push(chName);
                            }
                        }
                    }
                });

                await Promise.all(channelFetches);

                movies = Object.values(movieMap);
                movies.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'));

                allTags = [...new Set(movies.flatMap(m => m.tags || []))].sort((a, b) =>
                    tagLabel(a).localeCompare(tagLabel(b), 'pt-BR')
                );

                renderFilters();
                updateView();

            } catch (error) {
                console.error('Erro ao carregar filmes:', error);
                document.getElementById('movies-grid').innerHTML =
                    '<div class="error">Erro ao carregar catálogo dos canais.</div>';
            }
        }

        document.getElementById('search').addEventListener('input', updateView);

        const enhancedCheckbox = document.getElementById('useEnhanced');
        enhancedCheckbox.checked = localStorage.getItem('vtv_useEnhanced') === 'true';
        enhancedCheckbox.addEventListener('change', () => {
            localStorage.setItem('vtv_useEnhanced', enhancedCheckbox.checked);
            updateView();
        });

        loadMovies();
    </script>
</body>
</html>
