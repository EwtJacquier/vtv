<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTV Streaming - Catálogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.2rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        header p {
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .search-container {
            padding: 1.5rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        #search {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: background 0.3s;
        }

        #search::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #search:focus {
            background: rgba(255, 255, 255, 0.15);
        }

        .enhanced-toggle {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .enhanced-toggle input {
            accent-color: #764ba2;
        }

        .enhanced-toggle > span {
            color: #764ba2;
            font-size: 0.9rem;
        }

        .enhanced-toggle > span span {
            color: rgba(255, 255, 255, 0.5);
            background: none;
            display: block;
            position: absolute;
            margin-top: 3px;
            font-size: 0.7rem;
        }

        .stats {
            text-align: center;
            padding: 0 2rem 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
        }

        .channel-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .channel-tag {
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border-radius: 8px;
            background: rgba(102, 126, 234, 0.3);
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 1rem 2rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .movie-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-thumb.no-thumb {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
        }

        .movie-thumb.no-thumb::after {
            content: '🎬';
            font-size: 3rem;
            opacity: 0.3;
        }

        .movie-info {
            padding: 1rem;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.4;
            text-transform: capitalize;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .movie-thumb-container {
            position: relative;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            font-size: 2.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #764ba2;
        }

        @media (max-width: 600px) {
            .movies-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
                padding: 1rem;
            }

            header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.3rem;
            }

            .movie-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>VTV - CATÁLOGO</h1>
        <p>Escolha um filme para assistir</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Buscar filme...">
        <label class="enhanced-toggle">
            <input type="checkbox" id="useEnhanced">
            <span>Melhoria de Imagem (Experimental)<span>Melhora videos borrados mas atrapalha vídeos em alta qualidade. Consome GPU.</span></span>
        </label>
    </div>

    <div class="filters-container" id="filters"></div>

    <div class="stats" id="stats"></div>

    <div class="movies-grid" id="movies-grid">
        <div class="loading">Carregando catálogo...</div>
    </div>

    <script>
        const MOVIES_DIR = './movies_hls';
        const CHANNELS_DIR = './channels';

        const CHANNEL_FILES = [
            'afterDark', 'animetv', 'epictv', 'hokkaido',
            'marathon', 'neverland', 'paradox', 'rewindtv', 'superHero'
        ];

        let movies = [];
        let allChannels = [];
        let activeFilter = null;

        function formatTitle(id) {
            return id
                .replace(/_/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        function formatChannelName(filename) {
            return filename
                .replace(/([A-Z])/g, ' $1')
                .replace(/^\s/, '')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
        }

        function createMovieCard(movie) {
            const useEnhanced = document.getElementById('useEnhanced').checked;
            const playerPage = useEnhanced ? 'player_enhanced.html' : 'player.html';

            const card = document.createElement('a');
            card.className = 'movie-card';
            card.href = `${playerPage}?movie=${encodeURIComponent(movie.id)}`;

            const thumbUrl = `${MOVIES_DIR}/${movie.id}/thumb.jpg`;
            const tagsHtml = movie.channels.map(ch =>
                `<span class="channel-tag">${formatChannelName(ch)}</span>`
            ).join('');

            card.innerHTML = `
                <div class="movie-thumb-container">
                    <div class="movie-thumb">
                        <img src="${thumbUrl}" alt="${movie.title}" loading="lazy"
                             onerror="this.parentElement.classList.add('no-thumb'); this.remove();">
                    </div>
                    <div class="play-overlay">
                        <span class="play-icon">▶</span>
                    </div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">${movie.title}</div>
                    <div class="channel-tags">${tagsHtml}</div>
                </div>
            `;

            return card;
        }

        function renderMovies(moviesToRender) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';

            if (moviesToRender.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum filme encontrado</div>';
                return;
            }

            moviesToRender.forEach(movie => {
                grid.appendChild(createMovieCard(movie));
            });
        }

        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ç/g, 'c')
                .replace(/ñ/g, 'n');
        }

        function getFilteredMovies() {
            const query = document.getElementById('search').value;
            const normalizedQuery = normalizeText(query.trim());

            let filtered = movies;

            if (activeFilter) {
                filtered = filtered.filter(m => m.channels.includes(activeFilter));
            }

            if (normalizedQuery) {
                filtered = filtered.filter(movie =>
                    normalizeText(movie.title).includes(normalizedQuery) ||
                    normalizeText(movie.id).includes(normalizedQuery)
                );
            }

            return filtered;
        }

        function updateView() {
            const filtered = getFilteredMovies();
            document.getElementById('stats').textContent =
                filtered.length === movies.length
                    ? `${movies.length} filmes disponíveis`
                    : `${filtered.length} de ${movies.length} filmes`;
            renderMovies(filtered);
        }

        function renderFilters() {
            const container = document.getElementById('filters');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn' + (activeFilter === null ? ' active' : '');
            allBtn.textContent = `Todos (${movies.length})`;
            allBtn.addEventListener('click', () => {
                activeFilter = null;
                renderFilters();
                updateView();
            });
            container.appendChild(allBtn);

            allChannels.forEach(ch => {
                const count = movies.filter(m => m.channels.includes(ch)).length;
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (activeFilter === ch ? ' active' : '');
                btn.textContent = `${formatChannelName(ch)} (${count})`;
                btn.addEventListener('click', () => {
                    activeFilter = activeFilter === ch ? null : ch;
                    renderFilters();
                    updateView();
                });
                container.appendChild(btn);
            });
        }

        async function loadMovies() {
            try {
                const movieMap = {};

                const fetches = CHANNEL_FILES.map(async (chName) => {
                    try {
                        const res = await fetch(`${CHANNELS_DIR}/${chName}.json?v=`+Date.now());
                        if (!res.ok) return;
                        const data = await res.json();

                        for (const key of Object.keys(data)) {
                            if (!key.startsWith('dia_')) continue;
                            for (const entry of data[key]) {
                                if (!entry.id) continue;
                                if (!movieMap[entry.id]) {
                                    movieMap[entry.id] = {
                                        id: entry.id,
                                        title: formatTitle(entry.id),
                                        channels: []
                                    };
                                }
                                if (!movieMap[entry.id].channels.includes(chName)) {
                                    movieMap[entry.id].channels.push(chName);
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`Erro ao carregar canal ${chName}:`, e);
                    }
                });

                await Promise.all(fetches);

                movies = Object.values(movieMap);
                movies.sort((a, b) => a.title.localeCompare(b.title));

                allChannels = [...new Set(movies.flatMap(m => m.channels))].sort((a, b) =>
                    formatChannelName(a).localeCompare(formatChannelName(b))
                );

                renderFilters();
                updateView();

            } catch (error) {
                console.error('Erro ao carregar filmes:', error);
                document.getElementById('movies-grid').innerHTML =
                    '<div class="error">Erro ao carregar catálogo dos canais.</div>';
            }
        }

        document.getElementById('search').addEventListener('input', updateView);

        document.getElementById('useEnhanced').addEventListener('change', () => {
            updateView();
        });

        loadMovies();
    </script>
</body>
</html>
